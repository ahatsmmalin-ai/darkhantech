<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-label="Стилизованный современный город в Китае">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071735"/><stop offset=".55" stop-color="#0f4f7f"/><stop offset="1" stop-color="#09243c"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#7fdbff" stop-opacity=".7"/><stop offset="1" stop-color="#0b84bd" stop-opacity="0"/></radialGradient>
 <linearGradient id="tower" x1="0" x2="1"><stop stop-color="#092b4b"/><stop offset=".42" stop-color="#17688e"/><stop offset="1" stop-color="#061a35"/></linearGradient>
 <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#256f9a"/><stop offset="1" stop-color="#04142c"/></linearGradient>
 <pattern id="windows" width="26" height="38" patternUnits="userSpaceOnUse"><path d="M9 8h8v14H9z" fill="#8cc9ec" opacity=".37"/><path d="M9 27h8v5H9z" fill="#e7faff" opacity=".12"/></pattern>
 <pattern id="gr" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="#6ccfff" opacity=".08"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<rect width="1600" height="1050" fill="url(#sky)"/><rect width="1600" height="1050" fill="url(#gr)"/>
<circle cx="1010" cy="335" r="445" fill="url(#halo)"/><circle cx="1020" cy="370" r="133" fill="#d2efff" opacity=".14" filter="url(#blur)"/>
<path d="M0 855C410 765 715 810 1110 720S1430 700 1600 660" fill="none" stroke="#57ccfb" stroke-width="2" opacity=".22"/>
